name: Build Windows Laptop Super Power Saver EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows-app/requirements.txt

      - name: Build Standalone Single-File EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "SuperPowerSaverWin" windows-app/main.py
          pyinstaller --noconfirm --onefile --windowed --name "SuperPowerSaverWin" windows-app/main.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperPowerSaver-Windows-Portable-EXE
          path: dist/SuperPowerSaverWin.exe
          retention-days: 30

      - name: Attach Windows EXE to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Super Power Saver (Android APK + Windows Laptop EXE) Build ${{ github.run_number }}
          body: |
            ## 🚀 Super Power Saver Multi-Platform Release
            
            ### 📱 Android Features:
            - 🖤 **True OLED Black Launcher** (0 Watts display draw)
            - 📈 **24-Hour Battery Discharge Graph & Analytics**
            - ⚡ **Real-Time Live Wattage (W) & Charging Speed HUD**
            - 🚀 **Super Fast Turbo Charge Booster**
            - 🔴 **1% Extreme Blackout Mode** (Calls/SMS only, Loud Ringtone preserved)
            - 🛡️ **Sensor Sentry** (Frozen step counter & zero pocket wakelocks)
            
            ### 💻 Windows Laptop Edition (Exam Hall Safe Mode):
            - 🎓 **3+ Hour Exam Mode**: Caps CPU wattage (28W ➔ 4W) safely via `powercfg`.
            - 🛡️ **Zero-Kill Protection**: Portable apps (like `ufolee`, browsers, & exam clients) are **NEVER killed or closed**.
            - 📊 **Live Discharge Wattage & Battery Runtime HUD**.
            
            ### 📥 Downloads:
            - **Android**: `app-debug.apk`
            - **Windows Laptop**: `SuperPowerSaverWin.exe` (Single-file portable executable, zero install needed)
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/SuperPowerSaverWin.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
