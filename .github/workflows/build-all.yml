name: Build Super Power Saver (Android APK + Windows EXE)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows-app/requirements.txt

      - name: Build Single-File Windows Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "SuperPowerSaverWin" windows-app/main.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/SuperPowerSaverWin.exe

  publish-release:
    needs: [build-android, build-windows]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release_assets/

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release_assets/

      - name: Create Unified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Super Power Saver (Android APK + Windows Laptop EXE) Build ${{ github.run_number }}
          body: |
            ## 🚀 Super Power Saver Multi-Platform Release
            
            ### 📱 Android Edition:
            - 🖤 **OLED Black Launcher & Kiosk Guard** (0 Watts display draw)
            - 📈 **24-Hour Battery Discharge Curve & Graph**
            - ⚡ **Live Charging Wattage (W) & Current (mA) HUD**
            - 🚀 **Turbo Fast Charge Booster**
            - 🔴 **1% Extreme Blackout Mode** (Calls & SMS only, loud ringtone preserved)
            - 🛡️ **Sensor Sentry** (Step counter & motion sensors frozen)
            
            ### 💻 Windows Laptop Edition (Exam Safe Mode):
            - 🎓 **3+ Hour Exam Mode**: Hardware-level CPU wattage clamping (28W ➔ ~4W).
            - 🛡️ **Zero-Kill Protection**: All user tools, browsers, & portable exam clients are **NEVER killed or closed**.
            - 📊 **Live Discharge Wattage & Battery Runtime HUD**.
            
            ---
            ### 📥 Direct Downloads:
            - 📱 **Android Phone**: `app-debug.apk`
            - 💻 **Windows Laptop**: `SuperPowerSaverWin.exe` (Single-file portable `.exe`, zero installation needed)
          files: |
            release_assets/app-debug.apk
            release_assets/SuperPowerSaverWin.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
