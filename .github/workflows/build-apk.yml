name: Build Super Power Saver APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperPowerSaver-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Super Power Saver v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## 🚀 Super Power Saver APK Build
            
            ### ✨ Features in this build:
            - 🖤 **True OLED Black UI** (Saves up to 80% display power)
            - 📞 **Unrestricted Phone Calls & Dialer** (Never miss urgent calls)
            - 🔔 **Notification Gatekeeper** (Allows notifications only from your 6 selected apps, cancels all background wakeups)
            - ⚡ **Master Sync & Hardware Throttling** (Turns off background sync, dims screen, sets 15s timeout)
            - 📱 **App Whitelist Selector** (Easily customize your 6 essential apps)
            
            ### 📥 Download & Install:
            Download the `app-debug.apk` attached below and install it directly on your Android phone.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
